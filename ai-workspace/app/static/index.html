<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Workspace</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="authScreen" class="auth-screen">
  <div class="auth-box">
    <h2 id="authTitle">🔐 ورود به حساب</h2>
    <div id="authError" class="auth-error"></div>
    <input type="text" id="authUsername" placeholder="نام کاربری" />
    <input type="email" id="authEmail" placeholder="ایمیل" style="display:none" />
    <input type="password" id="authPassword" placeholder="رمز عبور" />
    <button class="btn-primary" id="authSubmit">ورود</button>
    <div class="auth-toggle">
      <span id="authToggleText">حساب نداری؟</span>
      <a href="#" id="authToggle">ثبت‌نام کن</a>
    </div>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="btn-new" id="newChat">➕ گفتگوی جدید</button>
      <button class="theme-toggle" id="themeToggle" title="تم">🌙</button>
    </div>
    <div class="conv-list" id="convList"></div>
    <div class="sidebar-bottom">
      <button id="openSettings" class="btn-ghost">⚙️ تنظیمات API</button>
      <button id="logoutBtn" class="btn-ghost" style="margin-top:6px">🚪 خروج</button>
      <a href="/admin" id="adminLink" class="btn-ghost" style="display:none;text-align:center;text-decoration:none;margin-top:6px">👑 پنل ادمین</a>
      <div class="agent-state">
        <div class="agent-title">🤖 Agent State</div>
        <div class="agent-steps" id="agentSteps">آماده</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="title">🧠 AI Workspace</div>
      <div class="status" id="status">آماده</div>
    </header>

    <section class="chat" id="chat"></section>

    <footer class="composer">
      <div class="attached" id="attached"></div>
      <div class="composer-row">
        <button class="icon-btn" id="fileBtn" title="آپلود فایل">📎</button>
        <input type="file" id="fileInput" hidden multiple />
        <textarea id="input" placeholder="پیامت را بنویس... (Enter ارسال)" rows="1"></textarea>
        <button class="icon-btn mic" id="micBtn" title="ضبط صدا">🎙️</button>
        <button class="send-btn" id="sendBtn">ارسال</button>
      </div>
    </footer>
  </main>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h3>⚙️ تنظیمات API</h3>
    <label>API Key <input type="password" id="setKey" placeholder="sk-..." /></label>
    <label>Base URL <input type="text" id="setUrl" /></label>
    <label>Model <input type="text" id="setModel" /></label>
    <div class="modal-actions">
      <button class="btn-ghost" id="closeSettings">بستن</button>
      <button class="send-btn" id="saveSettings">ذخیره</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
